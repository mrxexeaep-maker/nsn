name: Cloud image

# Publishes ghcr.io/open-pencil/cloud, the server with the editor and pages it serves, for each
# published release, and builds it without publishing when its inputs change in a pull request.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to rebuild the image for (vX.Y.Z or vX.Y.Z-beta.N).
        required: true
        type: string
  pull_request:
    paths:
      - 'packages/cloud/deploy/Dockerfile'
      - 'packages/cloud/deploy/Dockerfile.dockerignore'
      - '.github/workflows/cloud-image.yml'

permissions:
  contents: read

concurrency:
  group: cloud-image-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build Cloud image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG || github.sha }}
          persist-credentials: false

      # vX.Y.Z is tagged X.Y.Z, X.Y, and latest; a prerelease only its version and next.
      - name: Choose image tags
        id: tags
        run: |
          image=ghcr.io/open-pencil/cloud
          if [ "$PUBLISH" != true ]; then
            echo "tags=$image:pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "::error::$RELEASE_TAG is not a release tag"
            exit 1
          fi
          version=${RELEASE_TAG#v}
          case "$version" in
            *-*) tags="$image:$version,$image:next" ;;
            *) tags="$image:$version,$image:${version%.*},$image:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        id: build
        with:
          context: .
          file: packages/cloud/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0 AND MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=cloud-image
          cache-to: type=gha,scope=cloud-image,mode=max

